query GetTimingList(
  $startDate: String!
  $endDate: String!
  $limit: Int
  $offset: Int
) {
  getTimingList(
    startDate: $startDate
    endDate: $endDate
    limit: $limit
    offset: $offset
  ) {
    id
    code
    name
    regDate
    buyPrice
    currentPrice
    benefit
    timingDate
    buyDate
    priceDate
    buyState    
    sellPrice
    pairId
    period
    buyType
    sellType
  }
}
