query GetTimingList(
  $input: TimingListInput!
) {
  getTimingList(
    input: $input
  ) {
    id
    code
    name
    regDate
    buyPrice
    currentPrice
    benefit
    timingDate
    buyDate
    priceDate
    buyState    
    sellPrice
    pairId
    period
    buyType
    sellType
  }
}
