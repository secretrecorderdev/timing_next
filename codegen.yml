overwrite: true
schema: "http://127.0.0.1:8001/graphql"
documents: "lib/graphql/**/*.graphql"

generates:
  lib/graphql/generated.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typed-document-node"  

