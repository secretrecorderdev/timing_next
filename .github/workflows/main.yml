name: Deploy Timing Next

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build Next
        run: pnpm build

      - name: Prepare deploy files
        run: |
          mkdir -p deploy
          cp -r .next/standalone deploy/standalone
          cp -r .next/static deploy/standalone/.next/static
          cp -r public deploy/standalone/public || true
          tar -czf timing-next.tar.gz -C deploy/standalone .

      - name: Copy build files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TIMING_NEXT_SERVER_HOST }}
          username: ${{ secrets.TIMING_NEXT_SERVER_USER }}
          key: ${{ secrets.TIMING_NEXT_SERVER_SSH_KEY }}
          port: 22
          source: "timing-next.tar.gz"
          target: "/home/ubuntu/works/timing-next-deploy"

      - name: Restart Next server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TIMING_NEXT_SERVER_HOST }}
          username: ${{ secrets.TIMING_NEXT_SERVER_USER }}
          key: ${{ secrets.TIMING_NEXT_SERVER_SSH_KEY }}
          port: 22
          script: |
            mkdir -p /home/ubuntu/works/timing-next-app
            tar -xzf /home/ubuntu/works/timing-next-deploy/timing-next.tar.gz -C /home/ubuntu/works/timing-next-app

            cd /home/ubuntu/works/timing-next-app

            pm2 describe timing-next > /dev/null
            if [ $? -eq 0 ]; then
              pm2 restart timing-next
            else
              PORT=3006 pm2 start server.js --name timing-next
            fi

            pm2 save
